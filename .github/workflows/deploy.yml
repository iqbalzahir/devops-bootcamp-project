name: CI/CD Pipeline - Build, Test & Deploy Web App

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: devops-bootcamp/final-project-iqbal
  CONTAINER_NAME: shipit-app

jobs:
  build-and-push:
    name: Build & Push Docker Image to AWS ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Deploy to Web Server via AWS SSM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Container on Web Server via AWS SSM
        run: |
          COMMANDS=$(cat << 'EOF'
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 380267955385.dkr.ecr.ap-southeast-1.amazonaws.com
          docker pull 380267955385.dkr.ecr.ap-southeast-1.amazonaws.com/devops-bootcamp/final-project-iqbal:latest
          docker stop shipit-app || true
          docker rm shipit-app || true
          docker run -d --name shipit-app --restart always -p 80:80 380267955385.dkr.ecr.ap-southeast-1.amazonaws.com/devops-bootcamp/final-project-iqbal:latest
          EOF
          )

          COMMAND_JSON=$(echo "$COMMANDS" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --targets "Key=tag:Name,Values=web server" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":$COMMAND_JSON}" \
            --comment "Automated CI/CD Deployment from GitHub Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "Sent SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."

          aws ssm wait command-executed \
            --region ${{ env.AWS_REGION }} \
            --command-id "$COMMAND_ID" \
            --instance-id $(aws ec2 describe-instances --region ${{ env.AWS_REGION }} --filters "Name=tag:Name,Values=web server" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)

          echo "Deployment successfully executed!"
