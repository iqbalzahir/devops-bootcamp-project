---
- name: Pasang node_exporter pada Web Server
  hosts: web
  become: true
  roles:
    - prometheus.prometheus.node_exporter

- name: Naikkan stack pemantauan (Prometheus, Grafana & Cloudflare Tunnel) pada Monitoring Server
  hosts: monitoring
  become: true
  vars:
    docker_users: [ubuntu]
    cloudflare_tunnel_token: "eyJhIjoiY2I2ZGM1M2E4MGMzYjUwNDFlZjVhYjdhNjI5MTczMmYiLCJ0IjoiYTQ1Y2UxY2QtZmJlMC00YzI2LThiN2EtNThmMmY2Zjg3NjRiIiwicyI6IllqVmhNV0ZoTmpFdE0yUTVNaTAwWkRJM0xXSm1aVGt0Tm1NeVpXSmhOVGt4WXpSbSJ9"
  roles:
    - geerlingguy.docker
  tasks:
    - name: Cipta folder stack
      file:
        path: /opt/monitoring
        state: directory
        mode: '0755'

    - name: Hantar prometheus.yaml
      template:
        src: ../templates/prometheus.yaml.j2
        dest: /opt/monitoring/prometheus.yaml
        mode: '0644'

    - name: Hantar compose.yaml
      template:
        src: ../templates/compose.yaml.j2
        dest: /opt/monitoring/compose.yaml
        mode: '0644'

    - name: Naikkan container
      command: docker compose up -d
      args:
        chdir: /opt/monitoring
